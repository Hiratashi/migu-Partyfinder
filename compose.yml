services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate:
    build:
      context: .
      target: tools
    command: sh -c "npm run db:migrate && npm run db:seed"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID is required}
      DISCORD_REQUIRED_ROLE_ID: ${DISCORD_REQUIRED_ROLE_ID:-}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
